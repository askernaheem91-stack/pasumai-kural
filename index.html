body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);-webkit-text-size-adjust:100%}

button,.btn{font:600 1.02rem/1.2 var(--display);border-radius:14px;border:2px solid var(--leaf);background:var(--card);color:var(--leaf);padding:11px 16px;cursor:pointer;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.primary{background:var(--leaf);color:var(--on-leaf)}

.wide{width:100%}

dl{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:5px 12px;margin:10px 0} dt{color:var(--mute);font-weight:600} dd{margin:0}

/* ----- weather ----- */
const WMO = c => c===0?["☀️","Clear sky"]:c<=2?["🌤️","Partly cloudy"]:c===3?["☁️","Cloudy"]:c<=48?["🌫️","Fog"]:c<=57?["🌦️","Drizzle"]:c<=67?["🌧️","Rain"]:c<=77?["🌨️","Snow"]:c<=82?["🌧️","Rain showers"]:c<=86?["🌨️","Snow showers"]:["⛈️","Thunderstorm"];
const W = { busy:false, error:"", places:[] };
function defaultPlace() {
  if (DB.place) return DB.place;
  const f = farmer(); if (f && TN_DISTRICTS[f.district]) { const [lat,lon] = TN_DISTRICTS[f.district]; return {name:f.district+" district",lat,lon}; }
  return null;
}
async function getJSON(url) {
  const ctl = new AbortController(), t = setTimeout(()=>ctl.abort(), 12000);
  try { const r = await fetch(url,{signal:ctl.signal}); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function loadWeather(place) {
  W.busy = true; W.error = ""; W.places = []; save("place", place); refresh("weather");
  try {
    const d = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=7`);
    if (!d.current || !d.daily) throw new Error("bad data");
    save("weather", {place, at:Date.now(), current:d.current, daily:d.daily});
  } catch (e) {
    W.error = "Live weather could not load. Check your internet connection and try again. Previews inside claude.ai block live weather, so use the downloaded app file for it.";
  }
  W.busy = false; refresh("weather");
}
/* forecast for the chosen place, only if fetched in the last 6 hours */
function freshWeather() { const w = DB.weather, p = defaultPlace(); return w && p && w.place.name===p.name && Date.now()-w.at < 6*3600e3 ? w : null; }
function rainNext(days) { const w = freshWeather(); return w ? w.daily.precipitation_sum.slice(0,days).reduce((a,b)=>a+(b||0),0) : null; }
function advice(w) {
  const d = w.daily, out = [], day = i => i===0?"today":i===1?"tomorrow":dayName(d.time[i]);
  const first = (arr,test,n=7) => arr.slice(0,n).findIndex(test);
  let i = first(d.precipitation_sum, v=>v>=64.5);
  if (i>=0) out.push(["bad",`⛈️ Heavy rainfall warning: ${Math.round(d.precipitation_sum[i])} mm expected ${day(i)}. Clear drainage channels and avoid spraying and irrigation.`]);
  else if (d.precipitation_sum[0]+d.precipitation_sum[1] >= 10) out.push(["warn","🌧️ Rain expected today or tomorrow. Avoid pesticide spraying and unnecessary irrigation."]);
  i = first(d.temperature_2m_max, v=>v>=40);
  if (i>=0) out.push(["bad",`🔥 Heatwave alert: up to ${Math.round(d.temperature_2m_max[i])}°C ${day(i)}. Irrigate in the morning or evening and protect young plants and animals.`]);
  else if (first(d.temperature_2m_max, v=>v>=35, 3)>=0) out.push(["warn","🌡️ High temperature in the next 3 days. Monitor soil moisture."]);
  i = first(d.wind_speed_10m_max, v=>v>=40);
  if (i>=0) out.push(["bad",`💨 Strong winds expected ${day(i)}. Support tall crops such as banana and sugarcane. Do not spray.`]);
  else if (first(d.wind_speed_10m_max, v=>v>=20, 2)>=0) out.push(["warn","💨 Breezy today or tomorrow. Spray only when the air is calm."]);
  if (!out.length) out.push(["","✅ No rain, heat or wind warnings from this forecast. Check again tomorrow."]);
  return out;
}

/* ----- crop recommendations ----- */
const LOCAL = {Kuruvai:"Kharif",Samba:"Kharif",Thaladi:"Rabi",Navarai:"Rabi"};
function recommend(q) {
  return Object.entries(CROPS).map(([k,c]) => {
    const season = LOCAL[q.season] || q.season, why = [];
    let level = 2;
    if (!c.seasons.includes(season)) { level = 0; why.push("not usually sown in this season"); }
    if (c.maybe.includes(q.soil)) { level = Math.min(level,1); why.push("soil is workable but not ideal"); }
    else if (!c.soils.includes(q.soil)) { level = 0; why.push("soil is not suited"); }
    const w = {Low:1,Medium:2,High:3}[q.water];
    if (c.water > w) { if (c.water-w===1 && (w===2 || c.lowOK)) { level = Math.min(level,1); why.push("depends on water availability"); } else { level = 0; why.push("needs more water"); } }
    return {k,c,level,why};
  }).sort((a,b)=>b.level-a.level || a.c.water-b.c.water);
}

  ${sel("c_soil","Soil Type",SOILS,q.soil,"Choose soil type")}

function cropResults() {
  const q = F.crops, all = recommend(q), good = all.filter(r=>r.level), no = all.filter(r=>!r.level);
  const notes = [];
  if (q.rain!=="" && +q.rain>=100) notes.push("Much rain is expected. Make drainage ready and delay sowing of upland crops until the field drains.");
  if (q.rain!=="" && +q.rain<5 && q.water==="Low") notes.push("Little rain is expected and water is low. Wait for good soil moisture before sowing.");
  if (q.temp!=="" && +q.temp>=38) notes.push("It is very hot. Avoid sowing or transplanting in the afternoon.");
  return `<h2>Recommended Crops</h2>${notes.map(n=>`<div class="note warn">${n}</div>`).join("")}
  ${good.length?good.map(r=>`<div class="card"><div class="crophead">${cropArt(r.k)}<div><h3>${r.c.name}</h3><span class="tag ${r.level===2?"good":"warn"}">${r.level===2?"Suitable":"Depends on conditions"}</span>${r.why.length?`<p class="mute">${r.why.join("; ")}</p>`:""}</div></div>
   <p>${r.c.waterText} · ${r.c.days[0]}–${r.c.days[1]} days</p><button class="wide small" data-go="crop-${r.k}">VIEW CROP DETAILS</button></div>`).join(""):`<div class="note warn">No crop in this app matches all of these conditions. Try another season or ask your agriculture office.</div>`}

  <p class="mute">This is general guidance from soil, season and water. It does not yet include district-specific trial data${q.district?` for ${esc(q.district)}`:""}. Confirm with your block agriculture office before sowing.</p>`;

function harvestWindow(c,date) {

}
const today = () => { const d = new Date(); return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };

  <div id="preview">${F.photo?`<img src="${F.photo}" alt="Your crop photo"><p class="mute">This app does not analyse photos. Compare it with the results and show it to an agriculture officer.</p>`:`<p class="mute">The app shows your photo but does not analyse it.</p>`}</div>`}
  <label>3. What do you see?</label><div class="checks">${SYMPTOMS.map(s=>`<label><input type="checkbox" name="sym" id="sym-${s[0]}" value="${s[0]}"${q.tags.includes(s[0])?" checked":""}>${s[1]}</label>`).join("")}</div>
  ${field("p_text","Describe the symptoms of your crop",`<textarea id="p_text" placeholder="Example: yellow leaves with black spots">${esc(q.text)}</textarea>`)}
  <div class="stack"><button class="primary" type="submit">🔍 Identify Disease</button></div></form><div id="out"></div>`;
};
function identify(q) {
  const tags = new Set(q.tags); SYMPTOMS.forEach(s => { if (s[2].test(q.text)) tags.add(s[0]); });
  const hits = PESTS[q.crop].map(p => {
    const n = [...tags].filter(t=>p.tags.includes(t)).length;
    return {p,n,score: n + (q.text && q.text.toLowerCase().includes(p.name.split(" (")[0].toLowerCase()) ? 5 : 0)};
  }).filter(h=>h.score>0).sort((a,b)=>b.score-a.score || a.p.tags.length-b.p.tags.length).slice(0,3);
  return {tags,hits};
}
function pestResults() {
  const q = F.pests, {tags,hits} = identify(q);
  if (!tags.size && !hits.length) return `<div class="note warn" role="alert">Tick at least one symptom or describe it using words such as yellow, spots, curling, holes or drying.</div>`;
  if (!hits.length) return `<div class="note warn">No match in this app's list. Show the plant to your agriculture officer.</div>${HELP()}`;
  return `<h2>Possible problems</h2><div class="note warn"><b>Not a confirmed diagnosis.</b> These are matches by symptom only. Confirm with an agriculture expert before treating.</div>

}

  return `<h1>💧 Smart Irrigation Guidance</h1><form id="if" novalidate>

const stageField = (crop,v) => sel("i_stage","Crop Growth Stage",crop?IRRIGATION[crop].stages.map((s,i)=>[i,s[0]]):[[0,"Choose a crop first"]],v);
function irrResults() {
  const q = F.irr, c = IRRIGATION[q.crop], st = c.stages[q.stage], area = +q.area, cls = soilClass(q.soil);
  const mm = String(c.mm).split("–").map(Number);
  const litres = m => m*area*ACRE*10000, lakh = l => l>=1e5 ? `${round(l/1e5,1)} lakh litres` : `${round(l)} litres`;
  const season = mm.map(m=>lakh(litres(m))).join(" to ");
  const ok = c.methods.includes(q.method);
  let freq = st[1] ? `<p>${st[1]}</p>` : "";
  if (st[2] && q.crop==="paddy") freq += list(st[2]);
  else if (st[2]) freq += cls==="medium" ? `<p>Your soil is in between. Check moisture and use a gap between these:</p>${list(st[2])}` : list([st[2][cls==="light"?0:1]]);
  else if (cls!=="medium") freq += `<p class="mute">${cls==="light"?"Light soil drains fast, so check it more often.":"Heavy soil holds water, so check before each irrigation."}</p>`;
  let amount = "";
  if (q.method==="Drip Irrigation") amount = st[4] ? `With drip: ${st[4]}.` : "With drip, give small amounts often, set by your drip system's flow rate and the weather.";
  else if (q.method==="Sprinkler Irrigation") amount = "With sprinklers, apply light irrigations and stop before water pools.";
  else amount = `A surface irrigation 5 cm deep on ${round(area,2)} acres is about ${lakh(litres(50))}.`;
  const r = rainNext(3);
  const rain = r===null ? `<div class="note">Open <a href="#weather">Weather Information</a> first to add rain-based advice here.</div>`
    : r>=25 ? `<div class="note warn">🌧️ About ${Math.round(r)} mm of rain is forecast in 3 days. Postpone irrigation and check drainage.</div>`
    : r>=8 ? `<div class="note warn">🌦️ About ${Math.round(r)} mm of rain is forecast in 3 days. Check the soil first; a lighter or later irrigation may be enough.</div>`
    : `<div class="note">Only about ${Math.round(r)} mm of rain is forecast in 3 days. Do not count on rain.</div>`;
  return `<h2>Irrigation advice: ${CROPS[q.crop].name}</h2>${st[3]?`<div class="note warn"><b>Critical stage.</b> Water shortage now can reduce yield.</div>`:""}${rain}
  <div class="card"><h3>Water requirement</h3><p>About <b>${c.mm} mm</b> for the whole crop, or ${season} on ${round(area,2)} acres (rain included).</p><p>${amount}</p></div>
  <div class="card"><h3>How often at this stage</h3>${freq}<h3 style="margin-top:12px">Best time</h3><p>Early morning or evening.</p></div>
  <div class="card"><h3>Irrigation method</h3><p><span class="tag ${ok?"good":"warn"}">${ok?"Suits this crop":"Not the usual choice"}</span> ${q.method}</p><p>Common choices: ${c.methods.join(", ")}.</p></div>
  <div class="card"><h3>Water-saving techniques</h3>${list(c.save)}<h3 style="margin-top:12px">Over-irrigation warning</h3><p>Standing water in the root zone ${q.crop==="paddy"?"deeper than needed wastes water and nutrients":"can rot roots, spread disease and wash away fertilizer"}.</p>
  <h3 style="margin-top:12px">During drought</h3>${list(["Save water for the critical stages","Mulch the soil and remove weeds","Irrigate alternate rows or furrows where possible"])}</div>
  ${c.src?src(c.src)+`<p class="mute">Schedule and seasonal water figures follow TNAU guidance. Adjust for your field and weather.</p>`:`<p class="mute">This schedule is general guidance. Confirm it with your agriculture officer.</p>`}`;
}

function typeFields(q) {

function fertCalc(q) {
  const c = FERT[q.crop], t = c.types[q.type], ha = +q.area*ACRE;
  const plants = c.perPlant ? (+q.plants || Math.round(ha*3080)) : 0;
  const adj = ["N","P","K"].map(n => { if (q[n]===""||q[n]==null) return {f:1,r:null}; const v=+q[n],[lo,hi]=SOIL_LIMITS[n]; return v<lo?{f:1.25,r:"Low"}:v>hi?{f:.75,r:"High"}:{f:1,r:"Medium"}; });
  const total = t[1].map((x,i) => (c.perPlant ? x*plants/1000 : x*ha) * adj[i].f);
  const splits = (c.perPlant?c.splits:t[2]).map(s => { const n=[total[0]*s[1],total[1]*s[2],total[2]*s[3]]; return {label:s[0],urea:n[0]/.46,ssp:n[1]/.16,mop:n[2]/.60}; });
  return {c,t,ha,plants,adj,total,splits};
}
function fertResults() {

  const kg = n => n===0?"–":round(n,n<10?1:0);
  const tested = adj.some(a=>a.r);

  return `<h2>${CROPS[q.crop].name}: ${t[0]}</h2><p>For ${round(+q.area,2)} ${+q.area===1?"acre":"acres"} (${round(ha,2)} ha)${c.perPlant?`, ${round(plants)} plants`:""}.</p>

  ${["Nitrogen N","Phosphate P₂O₅","Potash K₂O"].map((n,i)=>`<tr><td>${n}</td><td>${round(t[1][i],t[1][i]%1?1:0)}</td><td>${adj[i].r?`${adj[i].r}${adj[i].f!==1?` (${adj[i].f>1?"+":"−"}25%)`:""}`:"Not given"}</td><td><b>${kg(total[i])}</b></td></tr>`).join("")}</table></div>
  <p class="mute">${tested?"Soil ratings use the TNAU rating chart. The standard column is the dose before any soil-test change. The 25% increase or decrease is a simple general rule; your soil health card or officer may give a more exact dose.":"No soil test entered, so this is the standard (blanket) dose. A soil test gives a better answer."}</p></div>
  <div class="card"><h3>Application timing</h3><p>Fertilizer in kg for your whole field. The highlighted row is the stage you chose.</p><div class="scroll"><table><tr><th>When</th><th>Urea</th><th>SSP</th><th>MOP</th></tr>
  ${splits.map((s,i)=>`<tr class="${i==q.stage?"nowrow":""}"><td>${s.label}</td><td>${kg(s.urea)}</td><td>${kg(s.ssp)}</td><td>${kg(s.mop)}</td></tr>`).join("")}
  <tr><td><b>Total</b></td><td><b>${kg(sum("urea"))}</b></td><td><b>${kg(sum("ssp"))}</b></td><td><b>${kg(sum("mop"))}</b></td></tr></table></div>
  <p class="mute">Urea 46% N, single super phosphate (SSP) 16% P₂O₅, muriate of potash (MOP) 60% K₂O.</p><p>${c.note}</p>${c.gypsum?`<p><b>Gypsum on day 45: ${round(c.gypsum*ha)} kg</b></p>`:""}
  <p><b>Method:</b> apply on moist soil, place it near the roots or along the furrow, cover it, and avoid applying just before heavy rain.${q.soil==="Sandy Soil"?" On sandy soil, giving nitrogen and potash in more, smaller splits reduces loss.":""}</p></div>
  <div class="card"><h3>Organic fertilizer options</h3>${list([
    c.perPlant?`<b>Farmyard manure:</b> about ${c.fym} kg per plant, ${round(c.fym*plants/1000,1)} t in all`:`<b>Farmyard manure or compost:</b> about ${round(c.fym*ha,1)} t (${c.fym} t per hectare) before the last ploughing`,
    "<b>Vermicompost:</b> a concentrated option; about 2.5 t per hectare can replace farmyard manure",
    "<b>Green manure:</b> grow daincha or sunnhemp and plough it in before the crop",
    "<b>Biofertilizers:</b> Azospirillum or Rhizobium (for pulses and groundnut) and phosphobacteria"])}</div>
  <div class="card"><details><summary>Signs of nutrient shortage</summary>${list(["<b>Nitrogen:</b> older leaves turn pale yellow","<b>Phosphorus:</b> small dark or purplish leaves, weak roots","<b>Potassium:</b> scorched edges on older leaves","<b>Zinc:</b> small leaves, brown or pale bands","<b>Iron:</b> young leaves yellow while veins stay green","<b>Magnesium:</b> yellowing between veins on older leaves","<b>Sulphur:</b> young leaves turn pale"])}</details>
  <details><summary>Improve soil health</summary>${list(["Test soil regularly","Add organic matter every season","Rotate with pulses","Do not burn residue","Avoid excess urea"])}</details></div>
  ${src(c.src)}<p class="mute">Standard doses are Tamil Nadu recommendations. Outside Tamil Nadu, use your state university's dose.</p>`;

/* ---------- router ---------- */
function parse() {
  const h = location.hash.slice(1) || "home";
  if (h.startsWith("crop-") && CROPS[h.slice(5)]) return {name:"crop",arg:h.slice(5),parent:"crops"};
  if (h.startsWith("tips-") && TIPS.some(t=>t[0]===h.slice(5))) return {name:"tip",arg:h.slice(5),parent:"tips"};
  const name = S[h] && h!=="crop" && h!=="tip" ? h : "home";
  return {name,parent: name==="dashboard"?"home":name==="farmer"?(farmer()?"dashboard":"home"):"dashboard"};
}
function render() {
  const r = parse();
  $("#bar").hidden = r.name==="home";
  $("#back").onclick = () => go(r.parent);
  $("#screen").innerHTML = S[r.name](r.arg);
  const done = {crops:[F.crops,cropResults],pests:[F.pests,pestResults],irrigation:[F.irr,irrResults],fertilizer:[F.fert,fertResults]}[r.name];
  if (done && done[0]?.done) $("#out").innerHTML = done[1]();
}
function refresh(name) { if (parse().name===name) render(); }
function show(html) { const o = $("#out"); o.innerHTML = html; o.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}); }

/* ---------- validation ---------- */
function invalid(errors) {
  document.querySelectorAll(".err").forEach(e=>e.remove());
  document.querySelectorAll("[aria-invalid]").forEach(e=>e.removeAttribute("aria-invalid"));
  const ids = Object.keys(errors);
  ids.forEach(id => { const el = $("#"+id); el.setAttribute("aria-invalid","true"); el.insertAdjacentHTML("afterend",`<p class="err">${errors[id]}</p>`); });
  if (ids.length) { $("#"+ids[0]).focus(); toast("Please check the marked fields"); }
  return ids.length>0;
}
const val = id => ($("#"+id)?.value ?? "").trim();
const need = (e,id,msg) => { if (!val(id)) e[id]=msg; };
const needArea = (e,id) => { const a=+val(id); if (!(a>0 && a<=10000)) e[id]="Enter the land area in acres, above 0"; };
function readFarmer() { return {name:val("name"),mobile:val("mobile"),state:val("state"),district:val("district"),village:val("village"),area:val("area"),soil:val("soil"),irrig:val("irrig")}; }
function saveFarmer() {
  const e = {};
  need(e,"name","Enter your name");
  if (!/^[6-9]\d{9}$/.test(val("mobile"))) e.mobile = "Enter a 10-digit mobile number starting with 6, 7, 8 or 9";
  need(e,"district","Choose or enter your district"); need(e,"village","Enter your village"); needArea(e,"area");
  need(e,"soil","Choose your soil type"); need(e,"irrig","Choose your irrigation type");
  if (invalid(e)) return false;
  const old = farmer(), f = readFarmer();
  const ok = save("farmer", f);
  if (!old || old.district!==f.district) save("place", null);
  delete F.farmer; delete F.crops; delete F.irr; delete F.fert; delete F.wq;
  toast(ok ? "Details saved successfully" : "Saved for now, but this phone is blocking storage");
  return true;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
  const p = e.target.closest("[data-place]"); if (p) return loadWeather(W.places[+p.dataset.place]);
  const id = e.target.closest("button")?.id;
  if (id==="savebtn") saveFarmer();
  if (id==="wrefresh") loadWeather(defaultPlace());
  if (id==="wsearch") searchPlace();
  if (id==="wgps") {
    if (!navigator.geolocation) { W.error="This device cannot share its location. Choose a district instead."; return render(); }
    W.busy = true; W.error = ""; render();
    navigator.geolocation.getCurrentPosition(
      x => loadWeather({name:"My location",lat:+x.coords.latitude.toFixed(3),lon:+x.coords.longitude.toFixed(3)}),
      () => { W.busy=false; W.error="Location was not shared. Choose a district or search for your village."; refresh("weather"); }, {timeout:10000});
  }
});
async function searchPlace() {
  const q = val("wq"); F.wq = q; if (!q) return invalid({wq:"Type a village or town name"});
  W.busy = true; W.error = ""; W.places = []; render();
  try {
    const d = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&countryCode=IN&language=en`);
    W.places = (d.results||[]).map(r=>({name:[r.name,r.admin2,r.admin1].filter(Boolean).join(", "),lat:r.latitude,lon:r.longitude}));
    if (!W.places.length) W.error = "No place found with that name. Try a nearby town or choose your district.";
  } catch (err) { W.error = "Place search could not load. Check your internet connection, or choose your district. Previews inside claude.ai block live weather."; }
  W.busy = false; refresh("weather");
}
document.addEventListener("keydown", e => { if (e.key==="Enter" && e.target.id==="wq") searchPlace(); });
document.addEventListener("input", () => { if (parse().name==="farmer" && $("#name")) F.farmer = readFarmer(); });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id==="state") { $("#distbox").innerHTML = districtField(t.value,""); F.farmer = readFarmer(); }
  if (t.id==="wdist" && t.value) { const [lat,lon]=TN_DISTRICTS[t.value]; loadWeather({name:t.value+" district",lat,lon}); }
  if (t.id==="sow") { F.sow = t.value; $("#harvest").textContent = harvestWindow(CROPS[parse().arg],t.value); }
  if (t.classList.contains("photo") && t.files[0]) {
    const rd = new FileReader(); rd.onload = () => { F.photo = rd.result; $("#preview").innerHTML = `<img src="${F.photo}" alt="Your crop photo"><p class="mute">This app does not analyse photos. Compare it with the results and show it to an agriculture officer.</p>`; }; rd.readAsDataURL(t.files[0]);
  }
  if (t.id==="i_crop") { $("#stagebox").innerHTML = stageField(t.value,0); $("#out").innerHTML=""; if (F.irr) F.irr.done=false; }
  if (t.id==="z_crop" || t.id==="z_type") {
    const crop = val("z_crop"); $("#typebox").innerHTML = typeFields({crop,type:t.id==="z_type"?+t.value:0,stage:0,plants:""}); $("#out").innerHTML=""; if (F.fert) F.fert.done=false;
  }
  if (t.id==="v_crop" || t.id==="v_type") { F.var = {crop:val("v_crop"),type:+val("v_type")}; $("#out").innerHTML = varietyResults(F.var); }
  if (t.id==="p_crop") { delete F.photo; if (F.pests) F.pests.done=false; $("#out").innerHTML=""; }
});
document.addEventListener("submit", ev => {
  ev.preventDefault(); const id = ev.target.id, e = {};
  if (id==="ff") { if (saveFarmer()) go("dashboard"); }
  if (id==="cf") {
    need(e,"c_soil","Choose soil type"); need(e,"c_season","Choose season"); need(e,"c_water","Choose water availability"); needArea(e,"c_area");
    if (invalid(e)) return;
    F.crops = {soil:val("c_soil"),season:val("c_season"),water:val("c_water"),area:val("c_area"),district:val("c_district"),temp:val("c_temp"),rain:val("c_rain"),done:true}; show(cropResults());
  }
  if (id==="pf") {
    need(e,"p_crop","Choose your crop"); if (invalid(e)) return;
    F.pests = {crop:val("p_crop"),tags:[...document.querySelectorAll("[name=sym]:checked")].map(x=>x.value),text:val("p_text"),done:true}; show(pestResults());
  }
  if (id==="if") {
    need(e,"i_crop","Choose crop"); need(e,"i_soil","Choose soil type"); needArea(e,"i_area"); need(e,"i_method","Choose irrigation method"); if (invalid(e)) return;
    F.irr = {crop:val("i_crop"),soil:val("i_soil"),area:val("i_area"),stage:+val("i_stage"),method:val("i_method"),done:true}; show(irrResults());
  }
  if (id==="zf") {
    need(e,"z_crop","Choose crop"); need(e,"z_soil","Choose soil type"); needArea(e,"z_area");
    ["z_N","z_P","z_K"].forEach(k=>{ if (val(k) && !(+val(k)>=0)) e[k]="Enter a number"; });
    if (val("z_plants") && !(+val("z_plants")>=1)) e.z_plants="Enter the number of plants";
    if (invalid(e)) return;
    F.fert = {crop:val("z_crop"),type:+val("z_type"),stage:+val("z_stage"),plants:val("z_plants"),soil:val("z_soil"),area:val("z_area"),N:val("z_N"),P:val("z_P"),K:val("z_K"),done:true}; show(fertResults());
  }
});
window.addEventListener("hashchange", () => { W.error=""; W.places=[]; render(); window.scrollTo(0,0); if (parse().name==="weather") autoWeather(); });
function autoWeather() { const p = defaultPlace(); if (p && !W.busy && !(freshWeather() && Date.now()-DB.weather.at < 15*60e3)) loadWeather(p); }
render();
if (parse().name==="weather") autoWeather();
})();
</script>
</body>
</html>
